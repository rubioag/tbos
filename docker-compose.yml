services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tbos
      POSTGRES_PASSWORD: tbos_dev_password
      POSTGRES_DB: tbos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: uvicorn tbos.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      TBOS_DATABASE_URL: postgresql+psycopg://tbos:tbos_dev_password@postgres:5432/tbos
      TBOS_REDIS_URL: redis://redis:6379/0
    volumes:
      - ./src:/app/src
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
